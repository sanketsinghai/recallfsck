services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports: ['127.0.0.1:16333:6333']
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/6333"']
      interval: 2s
      timeout: 2s
      retries: 30
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: recallfsck-local-only
      POSTGRES_DB: recallfsck
    ports: ['127.0.0.1:15432:5432']
    volumes:
      - ./examples/init-vector.sql:/docker-entrypoint-initdb.d/init-vector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d recallfsck']
      interval: 2s
      timeout: 2s
      retries: 30
