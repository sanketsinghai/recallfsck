[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "recallfsck"
version = "0.2.0rc2"
description = "Deterministic lifecycle integrity experiments for AI knowledge indexes"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
chroma = ["chromadb>=1,<2"]
langchain = ["langchain-chroma>=1,<2"]
pgvector = ["psycopg[binary]>=3.2,<4"]
test = ["pytest>=8,<10", "hypothesis>=6,<7", "build>=1,<2", "twine>=6,<7", "ruff>=0.11,<1"]
all = ["chromadb>=1,<2", "langchain-chroma>=1,<2", "psycopg[binary]>=3.2,<4", "pytest>=8,<10", "hypothesis>=6,<7"]

[project.urls]
Repository = "https://github.com/sanketsinghai/recallfsck"
Issues = "https://github.com/sanketsinghai/recallfsck/issues"

[project.entry-points.pytest11]
recallfsck = "recallfsck.pytest_plugin"

[project.scripts]
recallfsck = "recallfsck.product_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
include = ["recallfsck*"]
