name: Publish Python package
on:
  workflow_dispatch:
    inputs:
      destination:
        description: Package index
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/tests.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tagged package version
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          if os.environ['GITHUB_REF'] != 'refs/tags/v' + version:
              raise SystemExit('Dispatch this workflow from the matching release tag')
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: publish-distributions
          path: dist/
  verify-wheel:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/download-artifact@v4
        with:
          name: publish-distributions
          path: dist/
      - run: python qa/check_wheel.py --wheel dist/*.whl --output report/publish-wheel
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-publish-wheel-${{ matrix.python }}
          path: report/publish-wheel/
  publish:
    needs: [build, verify-wheel]
    runs-on: ubuntu-latest
    environment: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: publish-distributions
          path: dist/
      - name: Upload to TestPyPI
        if: inputs.destination == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Upload to PyPI
        if: inputs.destination == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
